<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/icon-192x192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/icons/icon-512x512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="My PWA App">
    <meta name="description" content="Mustafa Rahman — Full Stack Software Engineer. Interactive 3D Resume Book showcasing engineering portfolio, projects, and experience." />
    <meta name="keywords" content="software engineer, full stack developer, web developer, react, node.js, portfolio" />
    <meta property="og:title" content="Mustafa Rahman — Full Stack Software Engineer" />
    <meta property="og:description" content="Interactive 3D Resume Book — Full Stack Software Engineer Portfolio" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Mustafa Rahman — Full Stack Software Engineer</title>
    <style>
      body { margin: 0; background-color: #1e293b; }
      #app-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1e293b;
        z-index: 9999;
      }
      .loader-logo-wrapper {
        width: 120px;
        height: 120px;
        border-radius: 34px;
        margin-bottom: 30px;
        overflow: hidden;
        animation: float 3s ease-in-out infinite;
        box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-logo {
        width: 125%;
        height: 125%;
        object-fit: cover;
      }
      .progress-container {
        width: 280px;
        height: 28px;
        border: 2px solid #06b6d4;
        border-radius: 8px;
        padding: 4px;
        box-sizing: border-box;
        box-shadow: 0 0 12px rgba(6, 182, 212, 0.5), inset 0 0 12px rgba(6, 182, 212, 0.3);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background-color: #06b6d4;
        box-shadow: 0 0 15px #06b6d4;
        border-radius: 4px;
        -webkit-mask-image: repeating-linear-gradient(to right, black 0, black 20px, transparent 20px, transparent 26px);
        mask-image: repeating-linear-gradient(to right, black 0, black 20px, transparent 20px, transparent 26px);
        width: 0%;
        animation: progress-fill 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .loader-text {
        margin-top: 25px;
        color: #06b6d4;
        font-family: 'Inter', sans-serif;
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        animation: pulse-text 1.5s infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes progress-fill {
        0% { width: 0%; }
        50% { width: 100%; }
        100% { width: 100%; opacity: 0; }
      }
      @keyframes pulse-text {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="loader-logo-wrapper">
          <img src="/icons/icon-192x192.png" alt="Loading" class="loader-logo" />
        </div>
        <div class="progress-container">
          <div class="progress-fill"></div>
        </div>
        <div class="loader-text">LOADING ...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
